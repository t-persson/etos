name: Automatic Rebase
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set rebase labels
        run: python ${GITHUB_WORKSPACE}/scripts/rebase_labels.py
        env:
          GH_TOKEN: ${{ github.token }}
